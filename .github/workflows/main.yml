name: Build XLSX

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LIBXLSXWRITER_VERSION: 1.2.4

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nim-version:
          - 1.6.20
          - stable

    steps:
    - uses: actions/checkout@v4

    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nim-version }}

    - name: Build libxlsxwriter from source
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zlib1g-dev
        curl -L --fail --retry 3 \
          -o "/tmp/libxlsxwriter-${LIBXLSXWRITER_VERSION}.tar.gz" \
          "https://github.com/jmcnamara/libxlsxwriter/archive/refs/tags/v${LIBXLSXWRITER_VERSION}.tar.gz"
        tar -xzf "/tmp/libxlsxwriter-${LIBXLSXWRITER_VERSION}.tar.gz" -C /tmp
        make -C "/tmp/libxlsxwriter-${LIBXLSXWRITER_VERSION}" -j2
        sudo make -C "/tmp/libxlsxwriter-${LIBXLSXWRITER_VERSION}" install
        sudo ldconfig

    - name: Print Nim version
      run: nim -v

    - name: Print Nimble version
      run: nimble -v

    - name: Run tests
      run: nimble test
